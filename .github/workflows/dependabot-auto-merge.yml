name: dependabot-auto-merge

# Branch protection is a paid feature on private repositories, so GitHub's own
# auto-merge cannot be used here: it only exists to unblock a PR that something
# is holding back, and nothing holds these back. This workflow is the gate
# instead — it merges only after ci has already reported success.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # Needed by the dispatch below. Without it gh answers
  # "HTTP 403: Resource not accessible by integration".
  actions: write

jobs:
  merge:
    # Deliberately not gated on workflow_run.actor: that is whoever triggered the
    # run, which stops being Dependabot the moment anyone pushes a fixup commit
    # to the PR. The author of the PR is what actually matters, and it is checked
    # below once the PR is resolved.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request that ci just proved green
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # workflow_run carries a SHA, not a PR number. Match on it rather than
          # trusting event.workflow_run.pull_requests, which comes back empty in
          # more cases than the docs let on.
          pr=$(gh pr list --state open --json number,headRefOid,author \
                 --jq "map(select(.headRefOid == \"$HEAD_SHA\"
                              and (.author.login == \"app/dependabot\"
                                or .author.login == \"dependabot[bot]\")))
                       | .[0].number // empty")
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR at $HEAD_SHA — nothing to merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Merging PR #$pr"
          gh pr merge "$pr" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the freshly merged main
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN does not start a workflow run, so the
          # merge above would otherwise sit on main undeployed. workflow_dispatch
          # is one of the two events exempt from that rule.
          gh workflow run ci.yml --ref main
