name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The auto-merge workflow dispatches this after it merges a Dependabot PR.
  # A push made with GITHUB_TOKEN does not start a workflow run, so without this
  # the merge would land on main and never deploy.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version as .dx.json. Dependabot cannot bump Hugo, so these two move
  # together by hand.
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Build
        run: hugo --gc --minify

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the test runner
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Check every link in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal links only: external ones rate-limit and fail at random.
          args: --offline --no-progress --include-fragments --root-dir ${{ github.workspace }}/public public
          fail: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

      # Last step on purpose: reaching it means hugo built, every e2e test passed
      # and lychee found no broken link. Nothing ships that did not clear all three.
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=new-hugo --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
